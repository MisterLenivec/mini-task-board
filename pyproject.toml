# Tool configuration only. Application dependencies arrive in feature/project-foundation.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: real HTTP requests to a running server with a temporary database",
    "e2e: Chromium browser checks against the running application",
]
